<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" style="background:#FFFFFF; font-family:'Times New Roman', Times, serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1E293B" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B91C1C" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#15803D" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="1060" height="36" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" rx="4"/>
  <text x="550" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">
    DKIM Verification Pipeline: Decoupled Evaluation vs. Strict Domain Alignment
  </text>

  <!-- Left: Inbound Email Header -->
  <rect x="20" y="70" width="280" height="320" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" rx="4"/>
  <rect x="20" y="70" width="280" height="30" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" rx="4"/>
  <text x="160" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">Inbound Email Headers</text>
  
  <text x="35" y="125" font-size="11" fill="#0F172A">From: ceo@target-corp.com</text>
  <text x="35" y="150" font-size="11" fill="#0F172A">To: victim@company.com</text>
  <text x="35" y="175" font-size="11" fill="#0F172A">Subject: Urgent Wire Transfer</text>
  <line x1="30" y1="195" x2="290" y2="195" stroke="#CBD5E1" stroke-width="1"/>
  <text x="35" y="220" font-size="11" font-weight="bold" fill="#B91C1C">DKIM-Signature:</text>
  <text x="45" y="240" font-size="10.5" fill="#334155">v=1; a=rsa-sha256; c=relaxed/relaxed;</text>
  <text x="45" y="260" font-size="10.5" font-weight="bold" fill="#B91C1C">d=attacker-relay.com;</text>
  <text x="45" y="280" font-size="10.5" fill="#334155">s=2026; h=from:to:subject:date;</text>
  <text x="45" y="300" font-size="10.5" fill="#334155">bh=47DEQpj8HBSa+/TImW+5JCeuQeRkm5...;</text>
  <text x="45" y="320" font-size="10.5" fill="#334155">b=K8j2... [Valid RSA Signature over body]</text>

  <!-- Center Top: Vulnerable Path -->
  <rect x="360" y="70" width="360" height="150" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <rect x="360" y="70" width="360" height="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" rx="4"/>
  <text x="540" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#991B1B">Vulnerable Implementation (DkimValidator.php)</text>
  <text x="375" y="120" font-size="11" fill="#7F1D1D">1. Iterates all DKIM-Signature headers.</text>
  <text x="375" y="140" font-size="11" fill="#7F1D1D">2. Queries DNS for d=attacker-relay.com.</text>
  <text x="375" y="160" font-size="11" fill="#7F1D1D">3. Verifies RSA signature status === 'SUCCESS'.</text>
  <text x="375" y="180" font-size="11" font-weight="bold" fill="#B91C1C">4. Returns true without matching 'd=' to 'From:'.</text>
  <text x="375" y="202" font-size="10" font-style="italic" fill="#991B1B">Result: UI displays authentic DKIM badge for spoofed email.</text>

  <!-- Center Bottom: Hardened Path -->
  <rect x="360" y="240" width="360" height="150" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" rx="4"/>
  <rect x="360" y="240" width="360" height="28" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5" rx="4"/>
  <text x="540" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Hardened Aligned Pipeline (Proposed Patch)</text>
  <text x="375" y="290" font-size="11" fill="#14532D">1. Parse envelope From domain: target-corp.com.</text>
  <text x="375" y="310" font-size="11" fill="#14532D">2. Extract d=attacker-relay.com from signature.</text>
  <text x="375" y="330" font-size="11" fill="#14532D">3. Evaluate Domain Alignment: target-corp != attacker.</text>
  <text x="375" y="350" font-size="11" font-weight="bold" fill="#15803D">4. Assert 'From' in signed headers (h=) list.</text>
  <text x="375" y="372" font-size="10" font-style="italic" fill="#166534">Result: Returns false; spoofed signature rejected.</text>

  <!-- Right: Verification Outcome -->
  <rect x="780" y="70" width="300" height="150" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" rx="4"/>
  <text x="930" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#9F1239">UI Security Consequence</text>
  <rect x="800" y="125" width="260" height="40" fill="#FFE4E6" stroke="#E11D48" stroke-width="1" rx="3"/>
  <text x="930" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#9F1239">VALID SIGNATURE (SPOOFED)</text>
  <text x="930" y="190" text-anchor="middle" font-size="10.5" fill="#881337">Recipient trusts sender identity;</text>
  <text x="930" y="205" text-anchor="middle" font-size="10.5" fill="#881337">facilitates high-credibility spear phishing.</text>

  <rect x="780" y="240" width="300" height="150" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" rx="4"/>
  <text x="930" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Hardened Defense Result</text>
  <rect x="800" y="295" width="260" height="40" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" rx="3"/>
  <text x="930" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">UNALIGNED / REJECTED</text>
  <text x="930" y="360" text-anchor="middle" font-size="10.5" fill="#14532D">UI flags unauthenticated sender;</text>
  <text x="930" y="375" text-anchor="middle" font-size="10.5" fill="#14532D">alignment enforced per RFC 7489 / DMARC.</text>

  <!-- Connectors -->
  <path d="M 300 210 L 330 210 L 330 145 L 360 145" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 300 210 L 330 210 L 330 315 L 360 315" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <path d="M 720 145 L 780 145" fill="none" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 720 315 L 780 315" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>